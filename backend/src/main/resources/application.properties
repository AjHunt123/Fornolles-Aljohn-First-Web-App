spring.application.name=userhub
server.port=8080

# H2 in-memory database: it is wiped every time the backend restarts
spring.datasource.url=jdbc:h2:mem:userhubdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true

# Default ADMIN account, created on every startup by DataSeeder (CommandLineRunner)
app.admin.full-name=System Administrator
app.admin.email=admin@userhub.com
app.admin.password=Admin@123
